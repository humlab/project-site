<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f5f68">
<meta name="description" content="{{description}}">
<link rel="icon" href="favicon.ico">
<link rel="canonical" href="{{ogUrl}}">
<link rel="stylesheet" href="styles.css">
<link rel="alternate" hreflang="en" href="{{altEn}}">
<link rel="alternate" hreflang="sv" href="{{altSv}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Humlab Showcase">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{origin}}/assets/site-preview.jpg">
<meta property="og:image:alt" content="Humlab Showcase">
<meta property="og:url" content="{{ogUrl}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta name="twitter:card" content="summary_large_image">
</head>
<body class="{{bodyClass}}">
