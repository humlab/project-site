# nginx config for showcase.humlab.umu.se  (deployed as /etc/nginx/conf.d/default.conf;
# TLS, HTTP/2 and HSTS belong to the front proxy that hands us the unix socket)
#
# The old server block ended in `try_files $uri $uri/ /index.html`. That answered every
# missing file with 200 + HTML, which is how a missing og:image stayed invisible for
# years, and it also served /sead.html and /sead as the same page. Both are fixed below.

# Cache-Control is computed from the request instead of being set per location: any
# add_header inside a location replaces the server-level list, which would have dropped
# CSP/nosniff/referrer-policy from every /assets/* response. $cacheable keeps 404s from
# being cached for a month while an rsync --delete replaces an image.
map $status $cacheable { default 0; ~^[23] 1; }
map "$cacheable$uri" $cache_control {
    default                "no-cache";                       # html and everything unexpected
    "~^1/assets/"          "public, max-age=2592000";        # 30d, not immutable: files are
                                                              # replaced by hand under the same name
    "~^1/styles[.]css$"    "public, max-age=86400, must-revalidate";
}

server {
    listen unix:/socket/nginx.sock;
    absolute_redirect off;          # no http://host/... in a Location from a socket listener
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # In-page links are relative (sead.html) so dist/ can be opened from a directory or a
    # file:// path; canonical URLs are the extensionless form that og:url and
    # <link rel="canonical"> advertise. A server-level rewrite runs once, before location
    # matching, so it cannot loop against try_files.
    rewrite ^/index\.html$ / permanent;   # /index.html -> /, not -> /index -> /
    rewrite ^/(.+)\.html$ /$1 permanent;
    rewrite ^/(.+)/$ /$1 permanent;        # /sead/ is /sead: bookmarks and chat clients
                                           # append the slash, the old site answered those

    location = / {
        try_files /index.html =404;             # `index` does not apply under try_files
    }

    location / {
        try_files $uri $uri.html =404;
    }

    location = /index { return 301 /; }      # / and /index are the same page

    # The error page itself must not answer 200 at /404 (try_files would map it to
    # 404.html). A named location is internal-only, and — unlike an error_page URI —
    # does not re-run the rewrite phase above, which would bounce /404.html back out.
    location = /404 { return 404; }
    error_page 404 @notfound;
    location @notfound { try_files /404.html =404; }

    # ACME http-01 lives under /.well-known and must survive the dotfile deny below.
    location ^~ /.well-known/ { try_files $uri =404; }

    location ~ /\.[a-z] { deny all; }   # .gitkeep and any dotfile that slips through rsync

    # The site ships zero JavaScript, so an injected script cannot run. Keep comments OUT of
    # the quoted policy: a '#' inside the string is sent as a directive and the browser then
    # discards the entire header (tools/smoke.mjs shows it as "invalid characters").
    # api.kltr.nordu.net must stay in frame-src: the kaltura player on /plagiat redirects there.
    # media-src allows ikt.humlab.umu.se because /rave plays their mp4 inline instead of
    # framing it (they answer X-Frame-Options: deny); the file stays on their server.
    add_header Cache-Control          $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self' https://ikt.humlab.umu.se; frame-src https://www.youtube.com https://sketchfab.com https://api.kaltura.nordu.net https://api.kltr.nordu.net https://demo.humlab.umu.se; connect-src 'none'; manifest-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Only text is worth compressing; images and the mp4 already are. No brotli module in
    # the stock nginx image.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/plain image/svg+xml;
}
