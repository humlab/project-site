# busybox inetd: bind the unix socket quadlet volume, serve /www via httpd
# inetd mode (one short-lived httpd -i per connection). User field is root
# because in rootless podman the container's root IS the host service user;
# with --cap-drop=all no setuid is possible, so this must match the runtime user.
/socket/nginx.sock stream unix nowait root /bin/busybox httpd -i -h /www
