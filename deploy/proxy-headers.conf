# Header list for the showcase site, included at every level that sets add_header (four
# sites in proxy-showcase.conf).
#
# Why a file instead of one server-level list: nginx inherits add_header per level, and a
# location that sets any add_header of its own loses every inherited one. The location that
# gives .webp/.woff2/.mp4/.ico a Content-Type busybox cannot send therefore has to carry the
# whole list too - otherwise CSP and nosniff would vanish from exactly the image and font
# responses that need them most. Same trap, different century: this is what once stripped
# CSP from every /assets/* response in nginx.conf. Include the file, do not copy-paste it.

# CSP, Permissions-Policy and Cache-Control are ours: the shared edge sends none of them.
# nosniff and Referrer-Policy are sent by that edge too, and are kept here for two different
# and equally unromantic reasons. Which copy a browser obeys is per-field, not general, and
# both were measured: for X-Content-Type-Options Chromium obeys the FIRST copy (a script sent
# as text/html ran when the pair read `none, nosniff` and was blocked when it read
# `nosniff, none`), and nginx writes proxied headers before the outer server's own
# add_header output - so the nosniff below is the one in force. Referrer-Policy is the
# opposite: the Fetch spec takes the LAST value of the combined list, so on a 200 the edge's
# weaker `no-referrer-when-downgrade` is what a browser applies and this line is inert -
# measured by reading the Referer a subresource actually sends, in both orders. It stays
# because of `always`. On the live site today a 404 carries HSTS and nothing else, because the
# edge adds its copies on success only; run this vhost behind that same shape in a test rig
# and the error page comes back with our nosniff and our Referrer-Policy and no others. That
# is the case for the line. Getting `no-referrer` onto the 200s is the edge owner's edit.
# Strict-Transport-Security is deliberately absent. It is a claim about TLS, made by whatever
# terminates TLS; the edge sends it already, with a max-age we do not own, and on the live
# edge it does survive onto 404s. includeSubDomains asserted from a site vhost reaches over
# a boundary this repo has no business reaching over.
add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self' https://ikt.humlab.umu.se; frame-src https://www.youtube-nocookie.com https://sketchfab.com https://api.kaltura.nordu.net https://api.kltr.nordu.net; connect-src 'none'; manifest-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options   "nosniff" always;
add_header Referrer-Policy          "no-referrer" always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cache-Control            $showcase_cache always;
