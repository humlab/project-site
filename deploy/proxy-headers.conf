# Header list for the showcase site, included twice from proxy-showcase.conf.
#
# Why a file instead of one server-level list: nginx inherits add_header per level, and a
# location that sets any add_header of its own loses every inherited one. The location that
# gives .webp/.woff2/.mp4/.ico a Content-Type busybox cannot send therefore has to carry the
# whole list too - otherwise CSP and nosniff would vanish from exactly the image and font
# responses that need them most. Same trap, different century: this is what once stripped
# CSP from every /assets/* response in nginx.conf. Include the file, do not copy-paste it.

add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self' https://ikt.humlab.umu.se; frame-src https://www.youtube-nocookie.com https://sketchfab.com https://api.kaltura.nordu.net https://api.kltr.nordu.net; connect-src 'none'; manifest-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options   "nosniff" always;
add_header Referrer-Policy          "no-referrer" always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cache-Control            $showcase_cache always;
