# Front-proxy vhost for the showcase site: what the busybox container cannot do.
#
# The site container is `scratch` + busybox httpd. It serves bytes, Range requests and
# nothing else - it invents no header, so CSP, Permissions-Policy and cache policy have to
# come from the vhost in front of it (proxy-headers.conf says who owns which header), and so must the four file types whose MIME type is
# missing from busybox's compiled-in table (it ignores /etc/mime.types and httpd.conf has no
# syntax for it; a bare "*.ext:value" line means "run value as CGI" and 404s every request).
# This vhost hands over those four types. Not because the site breaks without them - it does
# not, measured below - but because 7 MB of images going out as anonymous bytes is a lie that
# some client downstream will eventually act on: a share bot reading og:image, a wget/curl
# pipeline, a proxy configured to enforce. Chromium 156, /visp, three server shapes:
#
#   busybox, no headers         7/7 webp shown, Prompt font loaded
#   + proxy adding nosniff      7/7 webp shown, Prompt font loaded   (no Content-Type at all)
#   + nosniff + a WRONG type    7/7 webp shown (text/html on a .webp, still rendered)
#   + this vhost                7/7, and the header says image/webp / font/woff2
#
# So nosniff's refusal is about mismatched scripts and stylesheets, neither of which this site
# can send (zero JS, and .css is typed correctly by busybox). One engine, headless.
#
# `add_header` alone cannot do the job anyway: it appends a second Content-Type beside the
# upstream one, and two conflicting values is worse than either. proxy_hide_header first.
#
# Include this file from the http { } block of the proxy (it puts its three maps at that
# level), with `showcase_backend` naming the container. deploy/proxy-headers.conf holds the
# header list; see the note in there for why it is included at four levels.

# The Content-Type to hand out, per extension, for the location above. Empty means "add no
# header at all", which nginx documents - so a request that somehow reaches that location
# without one of these extensions keeps the upstream value untouched.
map $uri $showcase_mime {
    default             "";
    # ~* because the location that uses this is case-insensitive: `~` keys here would let
    # /Foo.WEBP into that location, where proxy_hide_header has already dropped the upstream
    # type and the map adds nothing back - a 200 with no Content-Type under nosniff.
    "~*[.]webp$"        "image/webp";
    "~*[.]woff2$"       "font/woff2";
    "~*[.]mp4$"         "video/mp4";
    "~*[.]ico$"         "image/vnd.microsoft.icon";
}

map $status $cacheable { default 0; ~^[23] 1; }
map "$cacheable$uri" $showcase_cache {
    default                "no-cache";                        # html and anything unexpected
    "~^1/assets/"          "public, max-age=2592000";         # 30d, not immutable: files are
                                                               # replaced by hand under the name
    "~^1/styles[.]css$"    "public, max-age=86400, must-revalidate";
}

# The site container, named once. Pick the form your edge can actually reach - a socket in
# the volume both containers share, or the TCP port the socat sidecar publishes:
#   upstream showcase_backend { server unix:/run/user/1000/showcase-sockets/nginx.sock; }
#   upstream showcase_backend { server 127.0.0.1:9710; }
server {
    # NOT the socket the site container binds - that one is something this server connects
    # to, and both cannot listen on it (`listen unix:/socket/nginx.sock` here, while the
    # quadlet's inetd binds the same path through the mounted volume, is a container that
    # refuses to start). Put the listen/server_name your TLS edge actually forwards to.
    listen 127.0.0.1:8088;
    server_name showcase.humlab.umu.se;
    absolute_redirect off;              # relative Location: headers, whatever the listener
    server_tokens off;
    charset utf-8;

    # Headers on the responses nginx generates itself - the canonical 301s below answer
    # during the rewrite phase, before any location is chosen, so the includes inside the
    # locations never run for them. Security scanners read redirect headers too.
    include /etc/nginx/showcase/proxy-headers.conf;

    # Canonical form, exactly as nginx.conf does it when serving directly. A server-level
    # rewrite runs once, before location matching, so it cannot fight the proxy_pass below.
    rewrite ^/swedeb(\.html)?/?$ /riksdagsdebatter permanent;   # renamed project, old bookmarks
    rewrite ^/(.+)/index\.html$ /$1 permanent;
    rewrite ^/(.+)/index$ /$1 permanent;
    rewrite ^/index\.html$ / permanent;
    rewrite ^/(.+)\.html$ /$1 permanent;
    rewrite ^/(.+)/$ /$1 permanent;     # /sead/ is /sead; the container 302s it the other way

    # The types busybox does not know. proxy_hide_header drops whatever came upstream, ours
    # replaces it; nosniff then has something to accept. A missing .webp answers 404 with
    # this Content-Type on an error page - status is what matters there, and the status is
    # still 404.
    location ~* \.(webp|woff2|mp4|ico)$ {
        proxy_pass http://showcase_backend;
        proxy_hide_header Content-Type;
        include /etc/nginx/showcase/proxy-headers.conf;
        add_header Content-Type $showcase_mime always;
    }

    location / {
        # busybox answers a missing page with its own 124-byte text page and cannot be told
        # otherwise, so the branded 404 has to be fetched here: intercept, ask for the built
        # 404.html, force the status back to 404. Without the =404 the 200 that /404.html
        # answers with would be kept - the same soft-404 the old deployment was famous for.
        proxy_intercept_errors on;
        error_page 404 =404 @branded;
        # Ask for the file, not the URL. Handing busybox a directory name makes it answer its
        # own 302 to "$uri/", which this vhost's slash-strip rewrite then sends straight back
        # - /sead -> /sead/ -> /sead, ERR_TOO_MANY_REDIRECTS on every page. Served build.mjs's
        # second copy of each page directly (<route>/index.html, the root-absolute form
        # written for exactly this server) so the canonical URL is what <link rel=canonical>
        # claims and no redirector is involved. [^.] keeps /styles.css and friends alone.
        rewrite ^/$ /index.html break;
        rewrite ^/([^.]*[^./])/?$ /$1/index.html break;
        proxy_pass http://showcase_backend;
        include /etc/nginx/showcase/proxy-headers.conf;
    }

    location @branded {
        proxy_intercept_errors off;     # if 404.html itself is missing, do not recurse
        # proxy_pass may not carry a URI inside a named location, so rewrite the request
        # instead - with no URI on proxy_pass, the rewritten $uri is what gets sent.
        rewrite ^ /404.html break;
        proxy_pass http://showcase_backend;
        include /etc/nginx/showcase/proxy-headers.conf;
    }
}

